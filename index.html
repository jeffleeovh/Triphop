    <script>
      (function() {
        // Intercept and suppress benign preview iframe errors:
        // 1. Vite HMR WebSocket connection rejections (WebSocket closed without opened)
        // 2. Cross-origin Disqus script loading errors (masked by browsers as "Script error.")
        function isIgnorable(msg, filename) {
          var str = (String(msg || '') + ' ' + String(filename || '')).toLowerCase();
          return (
            str.indexOf('script error') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('disqus') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isIgnorable(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && event.message;
          var filename = event && event.filename;
          if (isIgnorable(msg, filename)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isIgnorable(msg, url) || isIgnorable(error && error.message, url)) {
            return true; // suppresses the error from appearing in console/test-harness
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
